<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paint Steward – Home</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="fit.js"></script>
</head>
<body>
<a class="proto-home" href="index.html">← All screens</a>
<div class="phone">

  <div style="position: absolute; top: 24px; left: 20px; font-size: 15px; font-weight: 600; color: #9AA1AB">Paint Steward</div>
  <div style="position: absolute; top: 52px; left: 20px; font-size: 30px; font-weight: 700; letter-spacing: -0.02em">Your house</div>

  <label style="position: absolute; top: 104px; left: 16px; right: 16px; height: 48px; border-radius: 14px; background: #16191E; display: flex; align-items: center; gap: 10px; padding: 0 14px; box-sizing: border-box; color: #9AA1AB">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
    <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search paint</span>
    <input type="search" placeholder="Search a color, room, or brand" style="flex: 1; border: 0; background: transparent; color: #ECEDEF; font: 16px 'Space Grotesk', sans-serif; outline: none">
  </label>

  <div id="rooms" style="position: absolute; top: 168px; left: 16px; right: 16px; display: flex; flex-direction: column"></div>

  <a href="scan.html" style="position: absolute; bottom: 32px; left: 16px; right: 16px; height: 60px; border-radius: 30px; background: #FF9A4D; color: #0C0E11; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 17px; font-weight: 700">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"></path></svg>
    Scan a can
  </a>
</div>
<script>
const rooms = [
  ['Living room', ['#D1C7B8']],
  ['Kitchen', ['#EDEAE0', '#F2F0EA']],
  ['Master bedroom', ['#95978A', '#E9E9E2']],
  ['Master bath', ['#EDEAE0']],
  ['Guest bath', ['#CCC9C0', '#E9E9E2']],
  ['Hall', ['#D1CBC1']],
  ['Exterior', ['#2F3D4C']]
];
document.getElementById('rooms').innerHTML = rooms.map(([name, hexes]) => `
  <a href="room.html" style="height: 64px; display: flex; align-items: center; gap: 14px; padding: 0 4px; border-bottom: 1px solid #1F2329; color: #ECEDEF; text-decoration: none">
    <div style="display: flex; width: 52px; flex-shrink: 0">
      ${hexes.map(h => `<div style="width: 26px; height: 26px; border-radius: 13px; background: ${h}; box-shadow: 0 0 0 2px #0C0E11; margin-right: -8px"></div>`).join('')}
    </div>
    <div style="flex: 1; font-size: 17px; font-weight: 500">${name}</div>
    <div style="font-size: 14px; color: #9AA1AB">${hexes.length === 1 ? '1 paint' : hexes.length + ' paints'}</div>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5C636D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
  </a>`).join('') + `
  <button style="height: 52px; border: 0; background: transparent; color: #9AA1AB; font: 500 15px 'Space Grotesk', sans-serif; text-align: left; padding: 0 4px">Edit rooms</button>`;
</script>
</body>
</html>
